[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uclv-visuales-downloader"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.11.1",
    "click>=8.1.3",
    "progressbar>=2.5",
    "requests>=2.28",
]

[project.scripts]
visuales = "uclv_visuales_downloader.main:download"

[tool.hatch.build.targets.wheel]
packages = ["src/uclv_visuales_downloader"]

[dependency-groups]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
